services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - hostinger_env
    env_file:
      - ${BASALTEMPERATUR_ENV_FILE:-.env.hostinger}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${APP_PORT:-3040}:3000"
    networks:
      edge:
        aliases:
          - basaltemperatur-app
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

secrets:
  hostinger_env:
    file: ${BASALTEMPERATUR_ENV_FILE:-.env.hostinger}

networks:
  edge:
    name: basaltemperatur_edge
    external: true
